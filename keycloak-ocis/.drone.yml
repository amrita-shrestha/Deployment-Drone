{"kind": "pipeline", "type": "docker", "name": "start-services", "steps": [{"name": "wait-for-postgres", "image": "owncloudci/wait-for:latest", "commands": ["wait-for -it postgres:5432 -t 300"]}, {"name": "keycloak", "image": "quay.io/keycloak/keycloak:26.0.5", "detach": true, "environment": {"OCIS_DOMAIN": "ocis:9200", "KC_HOSTNAME": "keycloak:8443", "KC_DB": "postgres", "KC_DB_URL": "jdbc:postgresql://postgres:5432/keycloak", "KC_DB_USERNAME": "keycloak", "KC_DB_PASSWORD": "keycloak", "KC_FEATURES": "impersonation", "KEYCLOAK_ADMIN": "admin", "KEYCLOAK_ADMIN_PASSWORD": "admin", "KC_HTTPS_CERTIFICATE_FILE": "./keycloak-certs/keycloakcrt.pem", "KC_HTTPS_CERTIFICATE_KEY_FILE": "./keycloak-certs/keycloakkey.pem"}, "commands": ["cat keycloak-certs/keycloakkey.pem", "ls -al", "pwd", "ls -al", "mkdir -p /opt/keycloak/data/import", "cp ocis-realm.dist.json /opt/keycloak/data/import/ocis-realm.json", "/opt/keycloak/bin/kc.sh start-dev --proxy-headers xforwarded --spi-connections-http-client-default-disable-trust-manager=false --import-realm --health-enabled=true"], "volumes": [{"name": "certs", "path": "keycloak-certs"}]}, {"name": "wait-for-keycloak", "image": "owncloudci/wait-for:latest", "commands": ["wait-for -it keycloak:8443 -t 300"]}], "services": [{"name": "postgres", "image": "postgres:alpine3.18", "environment": {"POSTGRES_DB": "keycloak", "POSTGRES_USER": "keycloak", "POSTGRES_PASSWORD": "keycloak"}}], "trigger": {"ref": ["refs/heads/master", "refs/heads/stable-*", "refs/tags/**", "refs/pull/**"]}}
